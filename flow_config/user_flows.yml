slots:
  order_number:
    type: text
    label: 订单号
    description: 旺店通聚合的多平台订单号

  order_status:
    type: text
    label: 订单状态
    description: 订单当前处理状态

  order_summary:
    type: text
    label: 订单摘要
    description: 订单商品、金额等摘要信息

  tracking_number:
    type: text
    label: 物流单号
    description: 订单对应的物流单号

  logistics_company:
    type: text
    label: 物流公司
    description: 订单对应的承运物流公司

  logistics_status:
    type: text
    label: 物流进度
    description: 当前物流履约进度

  product_id:
    type: text
    label: 商品ID
    description: 旺店通商品中心中的商品唯一标识

  refund_reason:
    type: text
    label: 售后原因
    description: 用户提出退款或售后诉求的原因

  refund_advice:
    type: text
    label: 售后处理建议
    description: 基于订单状态与售后原因生成的只读处理建议

  risk_level:
    type: text
    label: 风险等级
    description: 售后建议的风险等级，用于决定是否转人工复核

flows:
  onboarding:
    name: 欢迎引导
    description: 面向旺店通商家客服场景的欢迎流程，介绍订单、物流、商品、售后建议与人工转接能力。
    steps:
      - id: start
        type: start
        next: respond

      - id: respond
        type: action
        action: action_response
        args:
          text: "你好，这里是旺店通智能客服助手。我可以协助查询多平台订单与物流、查看商品信息、推荐相似商品、生成售后/退款处理建议；复杂或高风险问题可以转人工客服。"
        next: end

      - id: end
        type: end
        next: [ ]

  order_status_query:
    name: 多平台订单状态查询
    description: 通过旺店通业务中台查询淘宝/天猫、京东、拼多多、抖音等渠道聚合订单的当前处理状态。
    steps:
      - id: start
        type: start
        next: ask_order_number

      - id: ask_order_number
        type: collect
        slot_name: order_number
        response:
          text: "请告诉我需要查询的订单号。"
        next: lookup_order_status

      - id: lookup_order_status
        type: action
        action: action_lookup_order_status
        next: show_order_status

      - id: show_order_status
        type: action
        action: action_response
        args:
          text: "订单{{ slots.order_number }}当前状态是：{{ slots.order_status }}。{{ slots.order_summary }}"
        next: end

      - id: end
        type: end
        next: [ ]

  logistics_tracking:
    name: 订单物流查询
    description: 查询旺店通聚合订单的承运公司、物流单号与最新履约进度。
    steps:
      - id: start
        type: start
        next: ask_order_number

      - id: ask_order_number
        type: collect
        slot_name: order_number
        response:
          text: "请告诉我需要查询物流的订单号。"
        next: lookup_logistics

      - id: lookup_logistics
        type: action
        action: action_lookup_logistics
        next: show_logistics

      - id: show_logistics
        type: action
        action: action_response
        args:
          text: "订单{{ slots.order_number }}由{{ slots.logistics_company }}配送，物流单号是{{ slots.tracking_number }}。当前进度：{{ slots.logistics_status }}。"
        next: end

      - id: end
        type: end
        next: [ ]

  refund_request:
    name: 售后/退款建议
    description: 收集订单号与售后原因，结合订单状态生成处理建议；流程只读，不直接发起退款、取消订单或修改审批状态，高风险请求转人工复核。
    steps:
      - id: start
        type: start
        next: ask_order_number

      - id: ask_order_number
        type: collect
        slot_name: order_number
        response:
          text: "请告诉我需要处理售后的订单号。"
        next: ask_refund_reason

      - id: ask_refund_reason
        type: collect
        slot_name: refund_reason
        response:
          text: "请简单说明一下退款或售后的原因。"
        next: build_refund_advice

      - id: build_refund_advice
        type: action
        action: action_build_refund_advice
        next: show_refund_advice

      - id: show_refund_advice
        type: action
        action: action_response
        args:
          text: "订单{{ slots.order_number }}的售后处理建议：{{ slots.refund_advice }}（风险等级：{{ slots.risk_level }}）。该流程不会直接修改订单或提交退款；如需实际执行，请由人工客服复核后处理。"
        next: end

      - id: end
        type: end
        next: [ ]

  similar_product_recommendation:
    name: 相似商品推荐
    description: 基于当前商品调用旺店通商品中台的相似商品接口，为客服提供可解释的候选商品推荐。
    steps:
      - id: start
        type: start
        next:
          - if: "slots.get('product_id')"
            then: recommend
          - else: ask_product_id

      - id: ask_product_id
        type: collect
        slot_name: product_id
        response:
          text: "请先选择或告诉我一个商品，再为你查询相似商品。"
        next: recommend

      - id: recommend
        type: action
        action: action_recommend_similar_products
        next: end

      - id: end
        type: end
        next: [ ]

  human_handoff:
    name: 人工客服转接
    description: 将复杂、高风险或用户明确要求人工处理的对话切换到 WebSocket 人工坐席通道。
    steps:
      - id: start
        type: start
        next: respond

      - id: respond
        type: action
        action: action_response
        args:
          text: "好的，我为你转接人工客服。涉及退款执行、订单修改等高风险操作，会由人工客服复核后处理。"
        next: end

      - id: end
        type: end
        next: [ ]
