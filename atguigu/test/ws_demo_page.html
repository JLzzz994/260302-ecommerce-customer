<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>WebSocket 转人工演示（人机协同）</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
    body { background: #f0f2f5; padding: 16px; font-size: 14px; }
    h1 { font-size: 18px; margin-bottom: 12px; color: #1f2329; }
    .toolbar { background: #fff; border-radius: 8px; padding: 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .toolbar label { color: #5c6b77; font-size: 13px; }
    .toolbar select, .toolbar input { padding: 6px 8px; border: 1px solid #d4d9e0; border-radius: 6px; }
    .toolbar input { width: 130px; }
    button { padding: 6px 14px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .btn-primary { background: #3370ff; color: #fff; }
    .btn-warn { background: #ff8800; color: #fff; }
    .btn-danger { background: #e54545; color: #fff; }
    .btn-ghost { background: #eef1f5; color: #33404f; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #ccc; display: inline-block; margin-right: 4px; }
    .dot.online { background: #34c724; }
    .dot.reconnecting { background: #ff8800; animation: blink 1s infinite; }
    @keyframes blink { 50% { opacity: .3; } }
    .layout { display: flex; gap: 12px; margin-top: 12px; align-items: flex-start; }
    .card { background: #fff; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.08); padding: 12px; }
    .chat-card { flex: 1; display: flex; flex-direction: column; height: 480px; }
    .side-card { width: 360px; }
    .messages { flex: 1; overflow-y: auto; padding: 8px; background: #fafbfc; border-radius: 6px; margin: 8px 0; }
    .msg { margin: 6px 0; display: flex; }
    .msg.me { justify-content: flex-end; }
    .bubble { max-width: 72%; padding: 8px 12px; border-radius: 10px; background: #e8f0ff; color: #1f2329; word-break: break-all; }
    .msg.me .bubble { background: #3370ff; color: #fff; }
    .msg .who { font-size: 11px; color: #8a95a1; margin-bottom: 2px; }
    .system { text-align: center; color: #ff8800; font-size: 12px; margin: 6px 0; }
    .input-row { display: flex; gap: 8px; }
    .input-row input { flex: 1; padding: 8px 10px; border: 1px solid #d4d9e0; border-radius: 6px; }
    .queue-item { display: flex; justify-content: space-between; align-items: center; padding: 8px; border-bottom: 1px solid #f0f2f5; }
    .log { height: 200px; overflow-y: auto; background: #101418; color: #9fe3a0; font-family: Consolas, monospace; font-size: 12px; padding: 8px; border-radius: 6px; }
    .log .in { color: #7ec6ff; }
    .log .out { color: #ffd479; }
    .log .sys { color: #888; }
    .status-line { font-size: 12px; color: #5c6b77; margin-top: 6px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; background: #eef1f5; color: #33404f; }
    .badge.human { background: #ffe8d1; color: #c05b00; }
    .badge.queue { background: #e8f0ff; color: #2b5fd9; }
</style>
</head>
<body>
<h1>WebSocket 转人工演示（人机协同）</h1>

<div class="toolbar">
    <label>角色</label>
    <select id="role">
        <option value="user">用户（买家）</option>
        <option value="agent">客服坐席</option>
    </select>
    <label>ID</label>
    <input id="peerId" placeholder="u1 / a1">
    <button id="btnConnect" class="btn-primary" onclick="connect()">连接</button>
    <button id="btnDisconnect" class="btn-ghost" onclick="manualClose()" disabled>断开</button>
    <span><span class="dot" id="dot"></span><span id="stateText">未连接</span></span>
    <span class="badge" id="modeBadge">机器人模式</span>
    <span class="status-line" id="reconnectText"></span>
</div>

<div class="layout">
    <div class="card chat-card">
        <div><b id="chatTitle">聊天窗口</b></div>
        <div class="messages" id="messages"></div>

        <!-- 用户工具条 -->
        <div class="input-row" id="userRow" style="margin-bottom:8px">
            <button class="btn-warn" onclick="sendJson({type:'transfer_request'})">转人工</button>
            <button class="btn-ghost" onclick="sendJson({type:'cancel_transfer'})">取消排队</button>
        </div>
        <!-- 坐席工具条 -->
        <div class="input-row" id="agentRow" style="margin-bottom:8px; display:none">
            <select id="servingSelect" style="flex:1;padding:6px;border:1px solid #d4d9e0;border-radius:6px"></select>
            <button class="btn-danger" onclick="closeServing()">结束该会话</button>
        </div>

        <div class="input-row">
            <input id="chatInput" placeholder="输入消息，回车发送" onkeydown="if(event.key==='Enter')sendChat()">
            <button class="btn-primary" onclick="sendChat()">发送</button>
        </div>
    </div>

    <div class="card side-card">
        <b>协议日志（WebSocket 收发报文）</b>
        <div class="log" id="log"></div>
        <div class="status-line">蓝色=接收(IN) 黄色=发送(OUT) 灰色=事件。演示时可对照讲解每条消息。</div>
    </div>
</div>

<script>
/* ============ 全局状态 ============ */
let ws = null;
let role = "user";
let reconnectAttempts = 0;      // 已重连次数（指数退避用）
let manualClosed = false;       // 用户手动断开则不再自动重连
let heartbeatTimer = null;
let serving = {};               // 坐席端：sender_id -> 消息数组（当前服务中的会话）
let currentServing = null;      // 坐席端当前选中的会话

/* ============ URL 参数预填（方便开两个标签：?role=user&id=u1 / ?role=agent&id=a1） ============ */
const params = new URLSearchParams(location.search);
if (params.get("role")) document.getElementById("role").value = params.get("role");
if (params.get("id")) document.getElementById("peerId").value = params.get("id");
else document.getElementById("peerId").value = role === "agent" ? "a1" : "u1";
applyRoleUI();

/* ============ 连接管理 ============ */
function wsUrl() {
    role = document.getElementById("role").value;
    const id = document.getElementById("peerId").value || "u1";
    // ws 用 ws://（加密为 wss://）；注意：浏览器 JS 拿不到自定义 header，鉴权一般放 query 参数或首条消息
    return `ws://${location.host}/ws/${role}/${encodeURIComponent(id)}`;
}

function connect() {
    manualClosed = false;
    if (ws) { ws.onclose = null; ws.close(); }
    setState("connecting");
    ws = new WebSocket(wsUrl());
    ws.onopen = onOpen;
    ws.onmessage = onMessage;
    ws.onclose = onClose;
    ws.onerror = () => log("sys", "websocket onerror");
}

function onOpen() {
    reconnectAttempts = 0;
    setState("online");
    startHeartbeat();
}

function manualClose() {
    manualClosed = true;
    stopHeartbeat();
    ws && ws.close();
    setState("offline");
}

/* 断线自动重连：指数退避 1s → 2s → 4s → ... 封顶 30s（面试高频：为什么要指数退避？） */
function onClose() {
    stopHeartbeat();
    if (manualClosed) { setState("offline"); return; }
    const delay = Math.min(1000 * 2 ** reconnectAttempts, 30000);
    reconnectAttempts += 1;
    setState("reconnecting");
    document.getElementById("reconnectText").innerText =
        `连接断开，${(delay / 1000).toFixed(0)}s 后第 ${reconnectAttempts} 次重连...`;
    setTimeout(() => { if (!manualClosed) connect(); }, delay);
}

/* 应用层心跳：每 25s 发一条 heartbeat，服务端回 heartbeat_ack；超时未回可判定假死 */
function startHeartbeat() {
    stopHeartbeat();
    heartbeatTimer = setInterval(() => sendJson({type: "heartbeat"}), 25000);
}
function stopHeartbeat() { if (heartbeatTimer) clearInterval(heartbeatTimer); heartbeatTimer = null; }

/* ============ 发送 ============ */
function sendJson(obj) {
    if (!ws || ws.readyState !== 1) { alert("WebSocket 未连接"); return; }
    ws.send(JSON.stringify(obj));
    log("out", JSON.stringify(obj));
}

function sendChat() {
    const input = document.getElementById("chatInput");
    const text = input.value.trim();
    if (!text) return;
    if (role === "user") {
        sendJson({type: "chat", text});
        addMsg("me", "我", text);
    } else {
        if (!currentServing) { alert("请先从下方排队列表接入一个用户"); return; }
        sendJson({type: "agent_chat", sender_id: currentServing, text});
        addMsg("me", `我(坐席) → ${currentServing}`, text);
    }
    input.value = "";
}

function closeServing() {
    if (!currentServing) return;
    sendJson({type: "close_session", sender_id: currentServing});
}

/* ============ 接收：按消息协议分发 ============ */
function onMessage(event) {
    const msg = JSON.parse(event.data);
    log("in", JSON.stringify(msg));

    switch (msg.type) {
        case "connected":      addSystem(`已连接（${msg.role === "user" ? "用户端" : "坐席端"}）`); break;
        case "agent_ready":    renderQueue(msg.queue); addSystem("坐席工作台就绪"); break;
        case "bot_messages":   (msg.messages || []).forEach(m => addMsg("bot", "机器人", m.text || "[卡片]")); break;
        case "agent_message":  addMsg("bot", `客服 ${msg.agent_id}`, msg.text); break;
        case "user_message":   addServingMsg(msg.sender_id, msg.text); break;   // 坐席收到用户消息
        case "queue_position": setMode("queue", `排队中，前面还有 ${msg.position - 1} 人`); break;
        case "queue_update":   renderQueue(msg.queue); break;
        case "transfer_accepted": setMode("human", `客服 ${msg.agent_id} 已接入`);
                                  if (role === "agent" && msg.sender_id) { addServingOption(msg.sender_id); } break;
        case "transfer_cancelled": setMode("machine", "已取消排队，回到机器人模式"); break;
        case "session_closed":
            setMode("machine", "人工会话已结束，回到机器人模式");
            if (role === "agent" && currentServing) { removeServingOption(currentServing); }
            break;
        case "heartbeat_ack":  break;
        case "error":          addSystem(`⚠ ${msg.detail}`); break;
        default:               addSystem(`未知消息: ${msg.type}`);
    }
}

/* ============ 渲染 ============ */
function applyRoleUI() {
    role = document.getElementById("role").value;
    document.getElementById("userRow").style.display = role === "user" ? "flex" : "none";
    document.getElementById("agentRow").style.display = role === "agent" ? "flex" : "none";
    document.getElementById("chatTitle").innerText = role === "user" ? "聊天窗口（用户视角）" : "聊天窗口（坐席视角）";
}

function renderQueue(queue) {
    const sel = document.getElementById("servingSelect");
    const hasNew = (queue || []).some(q => !sel.querySelector(`option[value="${q.sender_id}"]`));
    // 重建排队区：简单做法是把排队用户显示在系统消息里 + 没接入的直接提示
    if (hasNew) {
        (queue || []).forEach(q => {
            if (!sel.querySelector(`option[value="${q.sender_id}"]`) && !serving[q.sender_id]) {
                addSystem(`用户 ${q.sender_id} 进入排队（第 ${q.position} 位）`);
            }
        });
    }
    // 排队列表渲染为可点击的“接入”系统消息（保持演示简单）
    window.latestQueue = queue || [];
}

// 坐席点击“接入”：直接调用（演示用；实际工作台会有排队面板）
document.addEventListener("keydown", e => {
    if (e.key === "F2" && role === "agent" && window.latestQueue?.length) {
        const target = window.latestQueue[0].sender_id;
        sendJson({type: "accept", sender_id: target});
        addSystem(`已发送接入请求：${target}`);
    }
});

function addServingOption(senderId) {
    const sel = document.getElementById("servingSelect");
    if (!sel.querySelector(`option[value="${senderId}"]`)) {
        const opt = document.createElement("option");
        opt.value = senderId; opt.innerText = `会话：${senderId}`;
        sel.appendChild(opt);
    }
    currentServing = senderId;
    sel.value = senderId;
    serving[senderId] = serving[senderId] || [];
}

function removeServingOption(senderId) {
    const sel = document.getElementById("servingSelect");
    const opt = sel.querySelector(`option[value="${senderId}"]`);
    if (opt) opt.remove();
    delete serving[senderId];
    currentServing = sel.value || null;
}

document.getElementById("servingSelect").addEventListener("change", e => {
    currentServing = e.target.value || null;
});

function addServingMsg(senderId, text) {
    addServingOption(senderId);
    addMsg("bot", `用户 ${senderId}`, text);
}

function addMsg(who, name, text) {
    const box = document.getElementById("messages");
    const div = document.createElement("div");
    div.className = "msg" + (who === "me" ? " me" : "");
    div.innerHTML = `<div><div class="who">${name}</div><div class="bubble"></div></div>`;
    div.querySelector(".bubble").textContent = text;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
}

function addSystem(text) {
    const box = document.getElementById("messages");
    const div = document.createElement("div");
    div.className = "system";
    div.textContent = text;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
}

function setMode(mode, tip) {
    const badge = document.getElementById("modeBadge");
    badge.className = "badge " + (mode === "machine" ? "" : mode);
    badge.innerText = mode === "machine" ? "机器人模式" : mode === "queue" ? "排队中" : "人工模式";
    if (tip) addSystem(tip);
}

function setState(s) {
    const dot = document.getElementById("dot");
    dot.className = "dot" + (s === "online" ? " online" : s === "reconnecting" ? " reconnecting" : "");
    document.getElementById("stateText").innerText = {online: "已连接", offline: "未连接", connecting: "连接中...", reconnecting: "重连中..."}[s];
    document.getElementById("btnConnect").disabled = s === "online" || s === "connecting";
    document.getElementById("btnDisconnect").disabled = s !== "online";
    if (s === "offline" || s === "reconnecting") document.getElementById("reconnectText").innerText = s === "offline" ? "" : document.getElementById("reconnectText").innerText;
}

function log(kind, text) {
    const box = document.getElementById("log");
    const line = document.createElement("div");
    line.className = kind;
    const t = new Date().toLocaleTimeString("zh-CN", {hour12: false});
    line.textContent = `[${t}] ${kind.toUpperCase()} ${text}`;
    box.appendChild(line);
    box.scrollTop = box.scrollHeight;
}

document.getElementById("role").addEventListener("change", applyRoleUI);

/* 坐席端：把排队接入做成按钮注入到工具条（比 F2 更直观） */
setInterval(() => {
    if (role !== "agent" || !window.latestQueue?.length) return;
    let bar = document.getElementById("queueBar");
    if (!bar) {
        bar = document.createElement("div");
        bar.id = "queueBar"; bar.style.cssText = "margin-bottom:8px;display:flex;gap:8px;flex-wrap:wrap";
        document.getElementById("agentRow").before(bar);
    }
    bar.innerHTML = "";
    window.latestQueue.forEach(q => {
        const btn = document.createElement("button");
        btn.className = "btn-warn";
        btn.innerText = `接入 ${q.sender_id}（第${q.position}位）`;
        btn.onclick = () => { sendJson({type: "accept", sender_id: q.sender_id}); };
        bar.appendChild(btn);
    });
}, 1000);
</script>
</body>
</html>
